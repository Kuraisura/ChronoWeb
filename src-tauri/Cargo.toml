[package]
name = "chrono-desktop"
version = "0.1.0"
description = "Chrono schedule, journal, and desktop reminders"
authors = ["Chrono"]
edition = "2021"

[lib]
name = "chrono_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
